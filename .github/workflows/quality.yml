name: Client quality

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install uv
        run: python -m pip install uv==0.6.16
      - name: Install locked client and test dependencies
        run: uv sync --frozen --extra test --group dev
      - name: Verify locked dependencies and requirements exports
        run: |
          uv lock --check --offline
          uv export --frozen --no-dev --no-emit-project --output-file requirements.txt > /dev/null
          uv export --frozen --extra test --group dev --no-emit-project --output-file requirements-dev.txt > /dev/null
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Version and changelog consistency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert f"## v{version}" in Path("CHANGELOG.md").read_text().splitlines(), "Add release notes for the package version"
          PY
      - name: Smoke and resource-read tests
        run: uv run --frozen --extra test --group dev python -m pytest -q tests/smoke tests/unit/test_resource_reads.py
      - name: Build standalone wheel
        run: uv build --wheel --no-build-isolation
